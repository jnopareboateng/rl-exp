[project]
name = "rlexp"
version = "0.1.0"
description = "RL for structure recovery from pharmacology profiles (Qwen3.5 / Qwen3.8), with controls-first evaluation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy", "rdkit"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rlexp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
